<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>お薬手帳</title><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{--b:#246bfd;--bg:#f5f7fb;--card:#fff;--txt:#172033;--mut:#6d7788;--green:#1f9d62;--red:#d63d3d}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt)}header{position:sticky;top:0;background:rgba(245,247,251,.94);padding:18px 16px 10px;z-index:4}h1{font-size:24px;margin:0}.date,.sub,.mut{color:var(--mut);font-size:12px;margin-top:4px}.wrap{max-width:720px;margin:auto;padding:0 14px 92px}.card{background:#fff;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 2px 12px #16233a0d}.section{font-size:14px;font-weight:800;margin:20px 4px 6px}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.title{font-weight:800}.pill{font-size:11px;padding:4px 8px;border-radius:999px;background:#eef3ff;color:#2458bb}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:700;background:#e9efff;color:#184fb7}.btn.primary{background:var(--b);color:white}.btn.red{background:#ffecec;color:#a82626}.big{width:100%;padding:15px;font-size:16px}.done{opacity:.55}.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e8ebf1;display:flex;justify-content:center;z-index:5}.nav button{width:25%;max-width:180px;border:0;background:#fff;padding:11px 2px 18px;color:#687386}.nav .active{color:var(--b);font-weight:800}.hidden{display:none}select,input,textarea{width:100%;border:1px solid #dfe4ec;border-radius:12px;padding:11px;background:#fff;font:inherit;margin:4px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.alert{padding:11px;border-radius:12px;background:#fff4df;color:#7c4b00;font-size:13px}.modal{position:fixed;inset:0;background:#0006;z-index:9;display:flex;align-items:flex-end}.modal.hidden{display:none}.sheet{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:22px 22px 0 0;padding:18px;max-height:86vh;overflow:auto}
</style></head><body>
<header><h1>💊 My Meds</h1><div class="date" id="dayLabel"></div></header>
<main class="wrap"><section id="todayView"></section><section id="medsView" class="hidden"></section><section id="historyView" class="hidden"></section><section id="moreView" class="hidden"></section></main>
<nav class="nav"><button class="active" data-view="todayView">🏠<br>今日</button><button data-view="medsView">💊<br>薬一覧</button><button data-view="historyView">📅<br>履歴</button><button data-view="moreView">⚙️<br>その他</button></nav>
<div id="modal" class="modal hidden"><div id="sheet" class="sheet"></div></div>
<script>
'use strict';
const APP_VERSION='1.2-safe';
const medicines=[
{id:'aga',use:'発毛',name:'Dクリニック 発毛内服 MH・FC・ZB',type:'定期',when:'朝',dose:'各1カプセル',info:'発毛治療の院内調剤薬。成分対応は処方資料で要確認。',stock:0},
{id:'dul',use:'気分・痛み',name:'デュロキセチン 20mg',type:'定期',when:'朝食後',dose:'1カプセル',info:'抗うつ薬・疼痛緩和薬として処方。',effects:'うつ病・うつ状態、および一部の疾患に伴う疼痛など。',side:'眠気、頭痛、めまい、吐き気、口渇、便秘などが報告されています。',stock:0},
{id:'tad',use:'その他',name:'タダラフィル 6mg',type:'定期',when:'1日1回',dose:'1錠',info:'処方元の指示を優先。',stock:0},
{id:'boost',use:'発毛',name:'Dミノキブースター＋外用薬',type:'定期',when:'洗髪後',dose:'指示量',info:'発毛外用。処方指示に従う。',stock:0},
{id:'lox',use:'痛み',name:'ロキソプロフェンNa 60mg',type:'必要時',when:'必要時',dose:'1錠',info:'解熱・消炎・鎮痛薬。',effects:'痛み・炎症や発熱を抑える目的で使われる薬です。',side:'胃部不快感、腹痛、吐き気、眠気などが報告されています。',stock:0},
{id:'dia2',use:'不安',name:'ジアゼパム 2mg',type:'必要時',when:'必要時',dose:'処方指示量',info:'筋緊張緩和・抗不安目的。',stock:0},
{id:'maoto',use:'風邪など',name:'ツムラ麻黄湯',type:'必要時',when:'必要時',dose:'処方指示量',info:'漢方薬。',stock:0},
{id:'lanso',use:'胃',name:'ランソプラゾールOD 15mg',type:'必要時',when:'必要時',dose:'処方指示量',info:'胃酸分泌抑制薬。',stock:0},
{id:'epi',use:'鼻炎',name:'エピナスチン 10mg',type:'必要時',when:'必要時',dose:'1錠',info:'アレルギー症状に使用。',stock:0},
{id:'zol',use:'睡眠',name:'ゾルピデム 5mg',type:'睡眠',when:'就寝前',dose:'処方指示量',info:'睡眠薬。処方指示を確認。',effects:'不眠症の治療に用いられる睡眠薬です。',side:'眠気、ふらつき、記憶への影響などに注意。睡眠随伴症状として異常行動が現れることがあります。',stock:0},
{id:'tri',use:'睡眠',name:'トリアゾラム 0.125mg',type:'睡眠',when:'就寝前',dose:'処方指示量',info:'睡眠導入薬。処方指示を確認。',effects:'不眠症などに用いられる睡眠導入薬です。',side:'眠気、ふらつき、記憶への影響などに注意。睡眠随伴症状として異常行動が現れることがあります。',stock:0},
{id:'esz',use:'睡眠',name:'エスゾピクロン 1mg',type:'過去',when:'就寝前',dose:'処方指示量',info:'過去の睡眠薬。',stock:3},
{id:'nit',use:'睡眠',name:'ニトラゼパム 5mg',type:'過去',when:'就寝前',dose:'処方指示量',info:'過去の睡眠薬。',stock:3},
{id:'quv',use:'睡眠',name:'クービビック 25mg',type:'過去',when:'不眠時',dose:'処方指示量',info:'過去の睡眠薬。',stock:3},
{id:'dayv',use:'睡眠',name:'デエビゴ 5mg',type:'過去',when:'不眠時',dose:'処方指示量',info:'過去の睡眠薬。',stock:3},
{id:'bila',use:'鼻炎',name:'ビラノア 20mg',type:'過去',when:'就寝前',dose:'1錠',info:'過去の鼻炎薬。',stock:3},
{id:'fexo',use:'鼻炎',name:'フェキソフェナジン 60mg',type:'過去',when:'朝食後・就寝前',dose:'1錠',info:'過去の鼻炎薬。',stock:3}
];
let logs=JSON.parse(localStorage.getItem('medlogs')||'[]');let stocks=JSON.parse(localStorage.getItem('stocks')||'{}');
const stockLabels=['🟢 十分','🟡 少なくなってきた','🔴 もうすぐ無い','⚪ 不明'];
function save(){localStorage.setItem('medlogs',JSON.stringify(logs));localStorage.setItem('stocks',JSON.stringify(stocks));}
function dayKey(){const d=new Date();if(d.getHours()<5)d.setDate(d.getDate()-1);return d.toLocaleDateString('sv-SE');}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openSheet(h){document.getElementById('sheet').innerHTML=h+'<button class="btn big" type="button" onclick="closeSheet()">閉じる</button>';document.getElementById('modal').classList.remove('hidden');}
function closeSheet(){document.getElementById('modal').classList.add('hidden');}
function logMed(id){const m=medicines.find(x=>x.id===id);openSheet(`<h2>${esc(m.use)}｜${esc(m.name)}</h2><div class="sub">${esc(m.dose)}・${esc(m.when)}</div><div class="section">効き目</div><select id="eff"><option>分からない</option><option>よく効いた</option><option>効いた</option><option>少し効いた</option><option>効かなかった</option></select>${m.use==='睡眠'?'<div class="section">睡眠・翌朝</div><select id="cond"><option>未入力</option><option>よく眠れた</option><option>寝つきに時間がかかった</option><option>夜中に起きた</option><option>翌朝眠気が残った</option><option>ふらつく</option><option>記憶があいまい</option></select>':''}<div class="section">自由メモ</div><textarea id="memo"></textarea><button class="btn primary big" type="button" onclick="commitLog('${id}')">服用・使用を記録</button>`);}
function commitLog(id){const m=medicines.find(x=>x.id===id);logs.push({id,name:m.name,use:m.use,ts:new Date().toISOString(),day:dayKey(),eff:document.getElementById('eff').value,cond:document.getElementById('cond')?.value||'',memo:document.getElementById('memo').value});save();closeSheet();render();}
function quick(m){return `<div class="row" style="padding:9px 0;border-bottom:1px solid #eef0f4"><div class="grow"><b>${esc(m.use)}</b><div class="sub">${esc(m.name)}</div></div><button class="btn" type="button" onclick="logMed('${m.id}')">＋飲んだ</button></div>`;}
function renderToday(){const done=new Set(logs.filter(x=>x.day===dayKey()).map(x=>x.id));document.getElementById('todayView').innerHTML='<div class="section">今日やること</div>'+medicines.filter(x=>x.type==='定期').map(m=>`<div class="card ${done.has(m.id)?'done':''}"><div class="row"><div class="grow"><span class="pill">${esc(m.use)}</span><div class="title">${esc(m.name)}</div><div class="sub">${esc(m.when)}・${esc(m.dose)}</div></div><button class="btn" type="button" onclick="logMed('${m.id}')">${done.has(m.id)?'✓ 記録済':'飲んだ'}</button></div></div>`).join('')+'<div class="section">💤 睡眠・就寝時</div><div class="card">'+medicines.filter(x=>x.type==='睡眠').map(quick).join('')+'</div><div class="section">必要なとき</div><div class="card">'+medicines.filter(x=>x.type==='必要時').map(quick).join('')+'</div>';}
function detail(id){const m=medicines.find(x=>x.id===id);openSheet(`<h2>${esc(m.use)}｜${esc(m.name)}</h2><p>${esc(m.info)}</p><div class="section">効果・効能</div><div class="card">${esc(m.effects||'この薬は製剤・処方目的の確認が必要なため、今は確定情報を表示していません。')}</div><div class="section">主な副作用・注意</div><div class="card">${esc(m.side||'この薬は製剤の確認が必要なため、今は確定情報を表示していません。')}</div><div class="alert">表示は確認補助です。処方時の説明と最新の電子添文を優先してください。</div><div class="section">飲み方</div><div class="card">${esc(m.when)}・${esc(m.dose)}</div><div class="section">残量</div><select onchange="setStock('${id}',this.selectedIndex)">${stockLabels.map((x,i)=>`<option ${i===(stocks[id]??m.stock??3)?'selected':''}>${x}</option>`).join('')}</select>`);}
function setStock(id,n){stocks[id]=n;save();}
function renderMeds(){document.getElementById('medsView').innerHTML='<h2>薬一覧</h2>'+['定期','必要時','睡眠','過去'].map(g=>'<div class="section">'+g+'</div>'+medicines.filter(m=>m.type===g).map(m=>`<div class="card" onclick="detail('${m.id}')"><span class="pill">${esc(m.use)}</span><div class="title">${esc(m.name)}</div><div class="sub">${esc(m.when)}・${esc(m.dose)}｜${stockLabels[stocks[m.id]??m.stock??3]}</div></div>`).join('')).join('');}
function renderHistory(){const arr=[...logs].reverse();document.getElementById('historyView').innerHTML=`<h2>服薬履歴</h2><div class="grid"><div class="card"><b>${logs.length}</b><div class="mut">総記録数</div></div><div class="card"><b>${new Set(logs.map(x=>x.day)).size}</b><div class="mut">記録した日数</div></div></div>`+(arr.length?arr.map(x=>`<div class="card"><span class="pill">${esc(x.use)}</span><div class="title">${esc(x.name)}</div><div class="sub">${new Date(x.ts).toLocaleString('ja-JP')}・${esc(x.eff)}</div><div>${esc(x.memo||'')}</div></div>`).join(''):'<div class="card">まだ記録がありません。</div>');}
function updateApp(){const u=new URL(location.href);u.searchParams.set('_update',Date.now().toString());location.replace(u.toString());}
function renderMore(){document.getElementById('moreView').innerHTML=`<h2>その他</h2><div class="card"><div class="title">アプリ</div><div class="sub">安全版 ${APP_VERSION}</div><button class="btn primary big" type="button" onclick="updateApp()">🔄 アプリを更新</button><div class="sub">服薬履歴・残量設定は削除せず、公開中のページを再読み込みします。</div></div><div class="card"><div class="title">データ</div><div class="sub">服薬履歴 ${logs.length}件をこの端末に保存中</div></div>`;}
function render(){document.getElementById('dayLabel').textContent='服薬日 '+dayKey()+'（午前5時切替）';renderToday();renderMeds();renderHistory();renderMore();}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));document.getElementById(b.dataset.view).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');}));document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet();});render();
</script></body></html>
