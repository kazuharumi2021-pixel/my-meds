<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>My Meds</title>
<style>
:root{--b:#246bfd;--bg:#f5f7fb;--card:#fff;--txt:#172033;--mut:#6d7788;--green:#1f9d62;--amber:#d88a00;--red:#d63d3d;--vio:#7157d9}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt)}header{position:sticky;top:0;background:rgba(245,247,251,.94);backdrop-filter:blur(14px);padding:18px 16px 10px;z-index:4}h1{font-size:24px;margin:0}.date{color:var(--mut);font-size:13px;margin-top:4px}.wrap{max-width:720px;margin:auto;padding:0 14px 92px}.card{background:var(--card);border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 2px 12px #16233a0d}.section{font-size:14px;font-weight:800;margin:20px 4px 6px}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.title{font-weight:800}.sub{font-size:12px;color:var(--mut);margin-top:3px}.pill{font-size:11px;padding:4px 8px;border-radius:999px;background:#eef3ff;color:#2458bb}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:700;background:#e9efff;color:#184fb7}.btn.primary{background:var(--b);color:white}.btn.green{background:#e9f8f0;color:#147348}.btn.red{background:#ffecec;color:#a82626}.big{width:100%;padding:15px;font-size:16px}.done{opacity:.55}.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e8ebf1;display:flex;justify-content:center;z-index:5}.nav button{width:25%;max-width:180px;border:0;background:#fff;padding:11px 2px 18px;color:#687386}.nav .active{color:var(--b);font-weight:800}.hidden{display:none}select,input,textarea{width:100%;border:1px solid #dfe4ec;border-radius:12px;padding:11px;background:#fff;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tag{display:inline-block;margin:3px 3px 0 0;padding:5px 8px;background:#f0f2f6;border-radius:9px;font-size:12px}.alert{padding:11px;border-radius:12px;background:#fff4df;color:#7c4b00;font-size:13px}.modal{position:fixed;inset:0;background:#0006;z-index:9;display:flex;align-items:flex-end}.sheet{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:22px 22px 0 0;padding:18px;max-height:86vh;overflow:auto}.modal.hidden{display:none}.filebtn{display:block;text-align:center;border:1px dashed #9caccc;border-radius:14px;padding:14px;margin:8px 0;color:#315b9d}.stat{font-size:26px;font-weight:900}.mut{color:var(--mut);font-size:12px}
</style></head><body><header><h1>💊 My Meds</h1><div class="date" id="today"></div></header><main class="wrap">
<section id="todayView"></section><section id="medsView" class="hidden"></section><section id="historyView" class="hidden"></section><section id="moreView" class="hidden"></section></main>
<nav class="nav"><button class="active" data-v="todayView">🏠<br>今日</button><button data-v="medsView">💊<br>薬一覧</button><button data-v="historyView">📅<br>履歴</button><button data-v="moreView">⚙️<br>その他</button></nav>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<script>
const meds=[
{id:'aga',use:'発毛',name:'Dクリニック 発毛内服 MH・FC・ZB',type:'定期',when:'朝',dose:'各1カプセル',info:'発毛治療の院内調剤薬。成分対応は処方資料で要確認。',stock:0},
{id:'dul',use:'気分・痛み',name:'デュロキセチン 20mg',type:'定期',when:'朝食後',dose:'1カプセル',info:'抗うつ薬・疼痛緩和薬として処方。',stock:0},
{id:'tad',use:'その他',name:'タダラフィル 6mg',type:'定期',when:'1日1回',dose:'1錠',info:'処方元の指示を優先。',stock:0},
{id:'boost',use:'発毛',name:'Dミノキブースター＋外用薬',type:'定期',when:'洗髪後',dose:'指示量',info:'発毛外用。処方指示に従う。',stock:0},
{id:'lox',use:'痛み',name:'ロキソプロフェンNa 60mg',type:'必要時',when:'必要時',dose:'1錠',info:'解熱・消炎・鎮痛薬。',stock:0},
{id:'dia2',use:'不安',name:'ジアゼパム 2mg',type:'必要時',when:'必要時',dose:'処方指示量',info:'筋緊張緩和・抗不安目的。',stock:0},
{id:'maoto',use:'風邪など',name:'ツムラ麻黄湯',type:'必要時',when:'必要時',dose:'処方指示量',info:'漢方薬。',stock:0},
{id:'lanso',use:'胃',name:'ランソプラゾールOD 15mg',type:'必要時',when:'必要時',dose:'処方指示量',info:'胃酸分泌抑制薬。',stock:0},
{id:'epi',use:'鼻炎',name:'エピナスチン 10mg',type:'必要時',when:'必要時',dose:'1錠',info:'アレルギー症状に使用。',stock:0},
{id:'zol',use:'睡眠',name:'ゾルピデム 5mg',type:'睡眠',when:'就寝前',dose:'処方指示量',info:'睡眠薬。飲酒や他の中枢神経抑制薬との併用等は処方指示を確認。',stock:0},
{id:'tri',use:'睡眠',name:'トリアゾラム 0.125mg',type:'睡眠',when:'就寝前',dose:'処方指示量',info:'睡眠導入薬。処方指示を確認。',stock:0},
{id:'esz',use:'睡眠',name:'エスゾピクロン 1mg',type:'過去',when:'就寝前',dose:'処方指示量',info:'過去の睡眠薬。',stock:3},
{id:'nit',use:'睡眠',name:'ニトラゼパム 5mg',type:'過去',when:'就寝前',dose:'処方指示量',info:'過去の睡眠薬。',stock:3},
{id:'quv',use:'睡眠',name:'クービビック 25mg',type:'過去',when:'不眠時',dose:'処方指示量',info:'過去の睡眠薬。',stock:3},
{id:'day',use:'睡眠',name:'デエビゴ 5mg',type:'過去',when:'不眠時',dose:'処方指示量',info:'過去の睡眠薬。',stock:3},
{id:'bila',use:'鼻炎',name:'ビラノア 20mg',type:'過去',when:'就寝前',dose:'1錠',info:'過去の鼻炎薬。',stock:3},
{id:'fexo',use:'鼻炎',name:'フェキソフェナジン 60mg',type:'過去',when:'朝食後・就寝前',dose:'1錠',info:'過去の鼻炎薬。',stock:3}
];
const S={get:k=>JSON.parse(localStorage.getItem(k)||'[]'),set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
function dayKey(d=new Date()){let x=new Date(d);if(x.getHours()<5)x.setDate(x.getDate()-1);return x.toISOString().slice(0,10)}
let logs=S.get('medlogs'), stocks=JSON.parse(localStorage.getItem('stocks')||'{}');
const stockLabels=['🟢 十分','🟡 少なくなってきた','🔴 もうすぐ無い','⚪ 不明'];
function save(){S.set('medlogs',logs);localStorage.setItem('stocks',JSON.stringify(stocks))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function logMed(id){let m=meds.find(x=>x.id===id),now=new Date();openSheet(`<h2>${esc(m.use)}｜${esc(m.name)}</h2><div class="sub">${esc(m.dose)}・${esc(m.when)}</div><div class="section">効き目</div><select id="eff"><option>分からない</option><option>よく効いた</option><option>効いた</option><option>少し効いた</option><option>効かなかった</option></select>${m.use==='睡眠'?`<div class="section">睡眠・翌朝</div><select id="cond"><option>未入力</option><option>よく眠れた</option><option>すぐ眠れた</option><option>寝つきに時間がかかった</option><option>夜中に起きた</option><option>何度も起きた</option><option>朝早く目が覚めた</option><option>翌朝問題なし</option><option>翌朝眠気が残った</option><option>だるい</option><option>ふらつく</option><option>頭痛</option><option>記憶があいまい</option><option>覚えていない行動があった</option></select>`:''}<div class="section">自由メモ</div><textarea id="memo" placeholder="症状・効き方・気になったこと"></textarea><button class="btn primary big" onclick="commitLog('${id}')">服用・使用を記録</button>`)}
function commitLog(id){let m=meds.find(x=>x.id===id);logs.push({id,name:m.name,use:m.use,ts:new Date().toISOString(),day:dayKey(),eff:document.getElementById('eff').value,cond:document.getElementById('cond')?.value||'',memo:document.getElementById('memo').value});save();closeSheet();render()}
function renderToday(){let d=dayKey();let done=new Set(logs.filter(x=>x.day===d).map(x=>x.id));let regular=meds.filter(x=>x.type==='定期');let prn=meds.filter(x=>x.type==='必要時');let sleep=meds.filter(x=>x.type==='睡眠');document.getElementById('todayView').innerHTML=`<div class="section">今日やること</div>${regular.map(m=>medCard(m,done.has(m.id),true)).join('')}<div class="section">💤 睡眠・就寝時</div><div class="card"><div class="alert">睡眠薬の組み合わせや量は、登録された処方指示を優先してください。自己判断の追加は避けてください。</div>${sleep.map(m=>quick(m)).join('')}</div><div class="section">必要なとき</div><div class="card">${prn.map(m=>quick(m)).join('')}</div><button class="btn primary big" onclick="finishDay()">✓ 今日を完了</button>`}
function medCard(m,isDone,check){return `<div class="card ${isDone?'done':''}"><div class="row"><div class="grow"><span class="pill">${esc(m.use)}</span><div class="title">${esc(m.name)}</div><div class="sub">${esc(m.when)}・${esc(m.dose)}</div></div>${check?`<button class="btn ${isDone?'green':''}" onclick="logMed('${m.id}')">${isDone?'✓ 記録済':'飲んだ'}</button>`:''}</div></div>`}
function quick(m){return `<div class="row" style="padding:9px 0;border-bottom:1px solid #eef0f4"><div class="grow"><b>${esc(m.use)}</b><div class="sub">${esc(m.name)}</div></div><button class="btn" onclick="logMed('${m.id}')">＋飲んだ</button></div>`}
function renderMeds(){let groups=['定期','必要時','睡眠','過去'];document.getElementById('medsView').innerHTML=`<div class="row"><h2 class="grow">薬一覧</h2><button class="btn primary" onclick="addMed()">＋薬を追加</button></div>${groups.map(g=>`<div class="section">${g}</div>${meds.filter(m=>m.type===g).map(m=>`<div class="card" onclick="detail('${m.id}')"><div class="row"><div class="grow"><span class="pill">${m.use}</span><div class="title">${m.name}</div><div class="sub">${m.when}・${m.dose}</div></div><div class="mut">${stockLabels[stocks[m.id]??m.stock??3]}</div></div></div>`).join('')}`).join('')}`}
function detail(id){let m=meds.find(x=>x.id===id),l=logs.filter(x=>x.id===id).slice(-10).reverse();openSheet(`<h2>${m.use}｜${m.name}</h2><p>${m.info}</p><div class="alert">効果・副作用・併用禁忌/注意などの医療情報は、処方時の説明と最新の公的添付文書を優先してください。</div><div class="section">飲み方</div><div class="card">${m.when}・${m.dose}</div><div class="section">在庫</div><select id="stockSel" onchange="setStock('${id}',this.selectedIndex)">${stockLabels.map((x,i)=>`<option ${i===(stocks[id]??m.stock??3)?'selected':''}>${x}</option>`).join('')}</select><div class="section">最近の使用</div>${l.length?l.map(x=>`<div class="card"><b>${new Date(x.ts).toLocaleString('ja-JP')}</b><div class="sub">効き目: ${x.eff}${x.cond?' / '+x.cond:''}</div>${x.memo?`<div>${esc(x.memo)}</div>`:''}</div>`).join(''):'<p class="mut">記録なし</p>'}`)}
function setStock(id,n){stocks[id]=n;save()}
function renderHistory(){let arr=[...logs].reverse();document.getElementById('historyView').innerHTML=`<h2>服薬履歴</h2><div class="grid"><div class="card"><div class="stat">${logs.length}</div><div class="mut">総記録数</div></div><div class="card"><div class="stat">${new Set(logs.map(x=>x.day)).size}</div><div class="mut">記録した日数</div></div></div>${arr.length?arr.map((x,i)=>`<div class="card"><div class="row"><div class="grow"><span class="pill">${x.use}</span><div class="title">${x.name}</div><div class="sub">${new Date(x.ts).toLocaleString('ja-JP')}・${x.eff}${x.cond?'・'+x.cond:''}</div>${x.memo?`<div>${esc(x.memo)}</div>`:''}</div><button class="btn red" onclick="delLog(${logs.indexOf(x)})">削除</button></div></div>`).join(''):'<div class="card">まだ記録がありません。</div>'}`}
function delLog(i){if(confirm('この記録を削除しますか？')){logs.splice(i,1);save();render()}}
function renderMore(){document.getElementById('moreView').innerHTML=`<h2>その他</h2><div class="card"><div class="title">薬を追加</div><button class="btn big" onclick="addMed()">📷 撮影 / 🖼️スクショ・写真 / ✏️手入力</button></div><div class="card"><div class="title">診察で見せる</div><div class="sub">現在薬、睡眠・頓服の使用履歴、効き目メモをこの端末で確認できます。</div><button class="btn big" onclick="showDoctor()">診察用まとめ</button></div><div class="card"><div class="title">データ管理</div><button class="btn" onclick="backup()">バックアップJSON</button> <button class="btn red" onclick="if(confirm('服薬履歴を全削除しますか？')){logs=[];save();render()}">履歴全削除</button></div>`}
function addMed(){openSheet(`<h2>薬を追加</h2><label class="filebtn">📷 カメラで撮影<input type="file" accept="image/*" capture="environment" style="display:none" onchange="imageSelected(this)"></label><label class="filebtn">🖼️ スクショ・写真から選択<input type="file" accept="image/*" style="display:none" onchange="imageSelected(this)"></label><div class="alert" id="imgmsg">このオフライン版では画像を外部送信しません。画像選択後、内容を確認して手入力できます。</div><div class="section">手入力</div><input id="newName" placeholder="薬名"><select id="newUse"><option>睡眠</option><option>鼻炎</option><option>痛み</option><option>不安</option><option>胃</option><option>発毛</option><option>その他</option></select><select id="newType"><option>必要時</option><option>定期</option><option>睡眠</option><option>過去</option></select><input id="newDose" placeholder="1回量・飲み方"><button class="btn primary big" onclick="addManual()">登録</button>`)}
function imageSelected(el){document.getElementById('imgmsg').innerText=el.files[0]?`選択: ${el.files[0].name}。この単体版にはOCRサーバーを接続していないため、自動読取は次の連携機能です。今回は続けて内容を入力してください。`:'画像未選択'}
function addManual(){let name=document.getElementById('newName').value.trim();if(!name)return alert('薬名を入力してください');meds.push({id:'u'+Date.now(),name,use:document.getElementById('newUse').value,type:document.getElementById('newType').value,when:'登録内容',dose:document.getElementById('newDose').value||'要確認',info:'ユーザー登録薬',stock:3});closeSheet();render()}
function finishDay(){localStorage.setItem('finished_'+dayKey(),'1');alert('今日を完了しました。午前5時を境界に次の服薬日へ切り替わります。')}
function showDoctor(){let recent=logs.filter(x=>Date.now()-new Date(x.ts).getTime()<30*864e5);let eff={};recent.forEach(x=>eff[x.name]=(eff[x.name]||0)+1);openSheet(`<h2>診察用まとめ</h2><div class="section">現在の定期薬</div>${meds.filter(x=>x.type==='定期').map(x=>`<div class="tag">${x.name}</div>`).join('')}<div class="section">直近30日・記録ベース</div>${Object.entries(eff).map(([n,c])=>`<div class="row card"><div class="grow">${n}</div><b>${c}回</b></div>`).join('')||'<p>記録なし</p>'}`)}
function backup(){let blob=new Blob([JSON.stringify({logs,stocks},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-meds-backup.json';a.click();URL.revokeObjectURL(a.href)}
function openSheet(h){document.getElementById('sheet').innerHTML=h+`<button class="btn big" onclick="closeSheet()">閉じる</button>`;document.getElementById('modal').classList.remove('hidden')}function closeSheet(){document.getElementById('modal').classList.add('hidden')}
function render(){document.getElementById('today').innerText=`服薬日 ${dayKey()}（午前5時切替）`;renderToday();renderMeds();renderHistory();renderMore()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));document.getElementById(b.dataset.v).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}));document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet()});render();
</script></body></html>
