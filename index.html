<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><meta name="app-version" content="1.1.0"><title>My Meds</title><style>:root{--b:#246bfd;--bg:#f5f7fb;--t:#172033;--m:#6d7788}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--t)}header{position:sticky;top:0;background:#f5f7fbef;padding:16px;z-index:3}h1{margin:0;font-size:24px}.sub{color:var(--m);font-size:12px;margin-top:4px}.wrap{max-width:720px;margin:auto;padding:0 14px 92px}.card{background:#fff;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 2px 12px #16233a0d}.section{font-weight:800;font-size:14px;margin:20px 3px 6px}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.title{font-weight:800}.pill{font-size:11px;background:#eef3ff;color:#2458bb;border-radius:999px;padding:4px 8px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800;background:#e9efff;color:#184fb7}.primary{background:var(--b);color:#fff}.red{background:#ffecec;color:#a82626}.big{width:100%;padding:15px;font-size:16px}.done{opacity:.55}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e6e9ef;display:flex;justify-content:center;z-index:5}.nav button{width:25%;max-width:180px;border:0;background:#fff;padding:10px 2px 18px;color:#687386}.nav .active{color:var(--b);font-weight:800}.hidden{display:none}select,input,textarea{width:100%;padding:11px;border:1px solid #dfe4ec;border-radius:12px;background:#fff;font:inherit;margin:5px 0}.alert{background:#fff4df;color:#7c4b00;padding:11px;border-radius:12px;font-size:13px}.modal{position:fixed;inset:0;background:#0006;z-index:9;display:flex;align-items:flex-end}.modal.hidden{display:none}.sheet{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:22px 22px 0 0;padding:18px;max-height:86vh;overflow:auto}.filebtn{display:block;text-align:center;border:1px dashed #9caccc;border-radius:14px;padding:14px;margin:8px 0;color:#315b9d}</style></head><body><header><h1>💊 My Meds</h1><div class="sub" id="day"></div></header><main class="wrap"><section id="today"></section><section id="meds" class="hidden"></section><section id="history" class="hidden"></section><section id="more" class="hidden"></section></main><nav class="nav"><button class="active" data-v="today">🏠<br>今日</button><button data-v="meds">💊<br>薬一覧</button><button data-v="history">📅<br>履歴</button><button data-v="more">⚙️<br>その他</button></nav><div id="modal" class="modal hidden"><div id="sheet" class="sheet"></div></div><script>
const VERSION='1.1.0';
const base=[['aga','発毛','Dクリニック 発毛内服 MH・FC・ZB','定期','朝','各1カプセル'],['dul','気分・痛み','デュロキセチン 20mg','定期','朝食後','1カプセル'],['tad','その他','タダラフィル 6mg','定期','1日1回','1錠'],['boost','発毛','Dミノキブースター＋外用薬','定期','洗髪後','指示量'],['lox','痛み','ロキソプロフェンNa 60mg','必要時','必要時','1錠'],['dia2','不安','ジアゼパム 2mg','必要時','必要時','処方指示量'],['maoto','風邪など','ツムラ麻黄湯','必要時','必要時','処方指示量'],['lanso','胃','ランソプラゾールOD 15mg','必要時','必要時','処方指示量'],['epi','鼻炎','エピナスチン 10mg','必要時','必要時','1錠'],['zol','睡眠','ゾルピデム 5mg','睡眠','就寝前','処方指示量'],['tri','睡眠','トリアゾラム 0.125mg','睡眠','就寝前','処方指示量'],['esz','睡眠','エスゾピクロン 1mg','過去','就寝前','処方指示量'],['nit','睡眠','ニトラゼパム 5mg','過去','就寝前','処方指示量'],['quv','睡眠','クービビック 25mg','過去','不眠時','処方指示量'],['dayv','睡眠','デエビゴ 5mg','過去','不眠時','処方指示量'],['bila','鼻炎','ビラノア 20mg','過去','就寝前','1錠'],['fexo','鼻炎','フェキソフェナジン 60mg','過去','朝食後・就寝前','1錠']].map(x=>({id:x[0],use:x[1],name:x[2],type:x[3],when:x[4],dose:x[5]}));
let userMeds=JSON.parse(localStorage.getItem('userMeds')||'[]'),logs=JSON.parse(localStorage.getItem('medlogs')||'[]'),stocks=JSON.parse(localStorage.getItem('stocks')||'{}');const meds=()=>base.concat(userMeds),stockL=['🟢 十分','🟡 少なくなってきた','🔴 もうすぐ無い','⚪ 不明'];
function save(){localStorage.setItem('medlogs',JSON.stringify(logs));localStorage.setItem('stocks',JSON.stringify(stocks));localStorage.setItem('userMeds',JSON.stringify(userMeds))}function key(){let d=new Date();if(d.getHours()<5)d.setDate(d.getDate()-1);return d.toLocaleDateString('sv-SE')}function sh(h){sheet.innerHTML=h+'<button class="btn big" onclick="cl()">閉じる</button>';modal.classList.remove('hidden')}function cl(){modal.classList.add('hidden')}
function take(id){let m=meds().find(x=>x.id===id);sh(`<h2>${m.use}｜${m.name}</h2><div class="sub">${m.when}・${m.dose}</div><div class="section">効き目</div><select id="eff"><option>分からない</option><option>よく効いた</option><option>効いた</option><option>少し効いた</option><option>効かなかった</option></select>${m.use==='睡眠'?'<div class="section">睡眠・翌朝</div><select id="cond"><option>未入力</option><option>よく眠れた</option><option>寝つきに時間がかかった</option><option>夜中に起きた</option><option>何度も起きた</option><option>翌朝問題なし</option><option>翌朝眠気が残った</option><option>だるい</option><option>ふらつく</option><option>頭痛</option><option>記憶があいまい</option><option>覚えていない行動があった</option></select>':''}<div class="section">自由メモ</div><textarea id="memo" placeholder="症状・効き方・気になったこと"></textarea><button class="btn primary big" onclick="commit('${id}')">服用・使用を記録</button>`)}function commit(id){let m=meds().find(x=>x.id===id);logs.push({id,name:m.name,use:m.use,ts:new Date().toISOString(),day:key(),eff:eff.value,cond:document.getElementById('cond')?.value||'',memo:memo.value});save();cl();render()}
function q(m){return `<div class="row" style="padding:9px 0;border-bottom:1px solid #eef0f4"><div class="grow"><b>${m.use}</b><div class="sub">${m.name}</div></div><button class="btn" onclick="take('${m.id}')">＋飲んだ</button></div>`}function renderToday(){let done=new Set(logs.filter(x=>x.day===key()).map(x=>x.id));today.innerHTML='<div class="section">今日やること</div>'+meds().filter(x=>x.type==='定期').map(m=>`<div class="card ${done.has(m.id)?'done':''}"><div class="row"><div class="grow"><span class="pill">${m.use}</span><div class="title">${m.name}</div><div class="sub">${m.when}・${m.dose}</div></div><button class="btn" onclick="take('${m.id}')">${done.has(m.id)?'✓ 記録済':'飲んだ'}</button></div></div>`).join('')+'<div class="section">💤 睡眠・就寝時</div><div class="card"><div class="alert">睡眠薬の種類・組み合わせ・量は処方指示を優先してください。</div>'+meds().filter(x=>x.type==='睡眠').map(q).join('')+'</div><div class="section">必要なとき</div><div class="card">'+meds().filter(x=>x.type==='必要時').map(q).join('')+'</div><button class="btn primary big" onclick="localStorage.setItem(`finished_${key()}`,1);alert(`今日を完了しました`) ">✓ 今日を完了</button>'}
function detail(id){let m=meds().find(x=>x.id===id);sh(`<h2>${m.use}｜${m.name}</h2><div class="alert">効果・副作用・飲み合わせは処方時の説明と最新の添付文書を優先してください。</div><div class="section">飲み方</div><div class="card">${m.when}・${m.dose}</div><div class="section">残量</div><select onchange="stocks['${id}']=this.selectedIndex;save()">${stockL.map((s,i)=>`<option ${i===(stocks[id]??3)?'selected':''}>${s}</option>`).join('')}</select><div class="section">この薬の履歴</div>${logs.filter(x=>x.id===id).slice(-8).reverse().map(x=>`<div class="card"><b>${new Date(x.ts).toLocaleString('ja-JP')}</b><div class="sub">${x.eff}${x.cond?'・'+x.cond:''}</div><div>${x.memo||''}</div></div>`).join('')||'<div class="sub">記録なし</div>'}`)}function renderMeds(){medsView=document.getElementById('meds');medsView.innerHTML='<div class="row"><h2 class="grow">薬一覧</h2><button class="btn primary" onclick="add()">＋薬を追加</button></div>'+['定期','必要時','睡眠','過去'].map(g=>'<div class="section">'+g+'</div>'+meds().filter(x=>x.type===g).map(m=>`<div class="card" onclick="detail('${m.id}')"><span class="pill">${m.use}</span><div class="title">${m.name}</div><div class="sub">${m.when}・${m.dose}　${stockL[stocks[m.id]??3]}</div></div>`).join('')).join('')}
function renderHistory(){history.innerHTML='<h2>服薬履歴</h2>'+[...logs].reverse().map((x)=>`<div class="card"><span class="pill">${x.use}</span><div class="title">${x.name}</div><div class="sub">${new Date(x.ts).toLocaleString('ja-JP')}・${x.eff}${x.cond?'・'+x.cond:''}</div><div>${x.memo||''}</div><button class="btn red" onclick="del('${x.ts}')">削除</button></div>`).join('')||'<div class="card">まだ記録がありません。</div>'}function del(ts){if(confirm('削除しますか？')){logs=logs.filter(x=>x.ts!==ts);save();render()}}
function updateApp(){sessionStorage.setItem('lastUpdateAttempt',new Date().toISOString());const u=new URL(location.href);u.searchParams.set('_update',Date.now());location.replace(u.toString())}
function add(){sh(`<h2>薬を追加</h2><label class="filebtn">📷 カメラで撮影<input type="file" accept="image/*" capture="environment" hidden onchange="picked(this)"></label><label class="filebtn">🖼️ スクショ・写真から選択<input type="file" accept="image/*" hidden onchange="picked(this)"></label><div class="alert" id="pickMsg">画像OCRは今後のAPI連携で有効化します。現在は画像選択＋確認入力です。</div><input id="nn" placeholder="薬名"><select id="nu"><option>睡眠</option><option>鼻炎</option><option>痛み</option><option>不安</option><option>胃</option><option>発毛</option><option>その他</option></select><select id="nt"><option>必要時</option><option>定期</option><option>睡眠</option><option>過去</option></select><input id="nd" placeholder="1回量・飲み方"><button class="btn primary big" onclick="manual()">登録</button>`)}function picked(i){pickMsg.textContent=i.files[0]?'選択済み: '+i.files[0].name:'未選択'}function manual(){if(!nn.value.trim())return alert('薬名を入力してください');userMeds.push({id:'u'+Date.now(),name:nn.value.trim(),use:nu.value,type:nt.value,when:'登録内容',dose:nd.value||'要確認'});save();cl();render()}
function renderMore(){more.innerHTML=`<h2>その他</h2><div class="card"><div class="title">アプリ</div><div class="sub">バージョン ${VERSION}</div><button class="btn primary big" onclick="updateApp()">🔄 アプリを更新</button><div class="sub">GitHub Pagesの最新版を再読込します。ブラウザ内の服薬履歴・追加薬・残量設定は削除しません。</div></div><div class="card"><div class="title">薬を追加</div><button class="btn big" onclick="add()">📷 撮影 / 🖼️スクショ・写真 / ✏️手入力</button></div><div class="card"><div class="title">データ管理</div><button class="btn" onclick="backup()">バックアップ</button></div>`}function backup(){let b=new Blob([JSON.stringify({version:VERSION,logs,userMeds,stocks},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-meds-backup.json';a.click()}
function render(){day.textContent='服薬日 '+key()+'（午前5時切替）';renderToday();renderMeds();renderHistory();renderMore()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));document.getElementById(b.dataset.v).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});modal.onclick=e=>{if(e.target===modal)cl()};render();
</script></body></html>
