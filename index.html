<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>お薬手帳</title><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{--b:#246bfd;--bg:#f5f7fb;--card:#fff;--txt:#172033;--mut:#6d7788;--green:#1f9d62;--red:#d63d3d}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt)}header{position:sticky;top:0;background:rgba(245,247,251,.94);padding:18px 16px 10px;z-index:4}h1{font-size:24px;margin:0}.date,.sub,.mut{color:var(--mut);font-size:12px;margin-top:4px}.wrap{max-width:720px;margin:auto;padding:0 14px 92px}.card{background:#fff;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 2px 12px #16233a0d}.section{font-size:14px;font-weight:800;margin:20px 4px 6px}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.title{font-weight:800}.pill{font-size:11px;padding:4px 8px;border-radius:999px;background:#eef3ff;color:#2458bb}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:700;background:#e9efff;color:#184fb7}.btn.primary{background:var(--b);color:white}.btn.red{background:#ffecec;color:#a82626}.big{width:100%;padding:15px;font-size:16px}.done{opacity:1;border:2px solid #45b97c;background:#effbf4}.done .title{color:#11693f}.btn.taken{background:#168a55;color:#fff}.quickTaken{background:#fff7e8;border:2px solid #f2a12b;border-radius:14px;padding:8px 10px;margin:5px 0}.btn.count{background:#ef8b12;color:#fff;min-width:76px}.source{font-size:12px;margin-top:8px}.source a{color:#246bfd;font-weight:700;text-decoration:none}.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e8ebf1;display:flex;justify-content:center;z-index:5}.nav button{width:25%;max-width:180px;border:0;background:#fff;padding:11px 2px 18px;color:#687386}.nav .active{color:var(--b);font-weight:800}.hidden{display:none}select,input,textarea{width:100%;border:1px solid #dfe4ec;border-radius:12px;padding:11px;background:#fff;font:inherit;margin:4px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.alert{padding:11px;border-radius:12px;background:#fff4df;color:#7c4b00;font-size:13px}.modal{position:fixed;inset:0;background:#0006;z-index:9;display:flex;align-items:flex-end}.modal.hidden{display:none}.sheet{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:22px 22px 0 0;padding:18px;max-height:86vh;overflow:auto}
</style></head><body>
<header><h1>💊 My Meds</h1><div class="date" id="dayLabel"></div></header>
<main class="wrap"><section id="todayView"></section><section id="medsView" class="hidden"></section><section id="historyView" class="hidden"></section><section id="moreView" class="hidden"></section></main>
<nav class="nav"><button class="active" data-view="todayView">🏠<br>今日</button><button data-view="medsView">💊<br>薬一覧</button><button data-view="historyView">📅<br>履歴</button><button data-view="moreView">⚙️<br>その他</button></nav>
<div id="modal" class="modal hidden"><div id="sheet" class="sheet"></div></div>
<script>
'use strict';
const APP_VERSION='1.3-safe';
const medicines=[
{id:'aga',use:'発毛',name:'Dクリニック 発毛内服 MH・FC・ZB',type:'定期',when:'朝',dose:'各1カプセル',info:'発毛治療の院内調剤薬。成分対応は処方資料で要確認。',effects:'発毛治療に用いる院内調剤薬です。構成成分ごとの効能は処方元の説明書で確認してください。',side:'副作用は構成成分により異なります。処方元の説明書・診察時の説明を優先してください。',sourceLabel:'Dクリニック処方資料',sourceUrl:'',stock:0},
{id:'dul',use:'気分・痛み',name:'デュロキセチン 20mg',type:'定期',when:'朝食後',dose:'1カプセル',info:'抗うつ薬・疼痛緩和薬として処方。',effects:'うつ病・うつ状態、および糖尿病性神経障害、線維筋痛症、慢性腰痛症、変形性関節症に伴う疼痛などに用いられます。',side:'眠気、頭痛、めまい、吐き気、口渇、便秘など。',sourceLabel:'PMDA 医療用医薬品情報',sourceUrl:'https://www.pmda.go.jp/PmdaSearch/iyakuSearch/',stock:0},
{id:'tad',use:'その他',name:'タダラフィル 6mg',type:'定期',when:'1日1回',dose:'1錠',info:'処方元の指示を優先。',effects:'タダラフィルは製剤により、勃起不全、前立腺肥大症に伴う排尿障害、肺動脈性肺高血圧症に用いられます。登録中の6mg製剤の処方目的は処方元へ確認してください。',side:'頭痛、ほてり、消化不良、背部痛など。硝酸薬等との併用は禁忌です。登録中の6mg製剤は処方元の説明を優先してください。',sourceLabel:'PMDA タダラフィル情報／処方元資料',sourceUrl:'https://www.pmda.go.jp/PmdaSearch/rdDetail/iyaku/2590016F1071_1?user=1',stock:0},
{id:'boost',use:'発毛',name:'Dミノキブースター＋外用薬',type:'定期',when:'洗髪後',dose:'指示量',info:'発毛外用。処方指示に従う。',effects:'発毛治療に用いる院内調剤・外用薬です。成分と濃度は処方元資料で確認してください。',side:'頭皮刺激など、成分と濃度により異なります。処方元資料を優先してください。',sourceLabel:'Dクリニック処方資料',sourceUrl:'',stock:0},
{id:'lox',use:'痛み',name:'ロキソプロフェンNa 60mg',type:'必要時',when:'必要時',dose:'1錠',info:'解熱・消炎・鎮痛薬。',effects:'関節痛、腰痛、歯痛、手術後・外傷後の痛みや炎症、急性上気道炎の解熱・鎮痛などに用いられます。',side:'胃部不快感、腹痛、吐き気、食欲不振、眠気など。',sourceLabel:'PMDA 医療用医薬品情報',sourceUrl:'https://www.pmda.go.jp/PmdaSearch/iyakuSearch/',stock:0},
{id:'dia2',use:'不安',name:'ジアゼパム 2mg',type:'必要時',when:'必要時',dose:'処方指示量',info:'筋緊張緩和・抗不安目的。',effects:'不安・緊張の軽減、筋けいれんの改善、麻酔前投薬などに用いられます。',side:'眠気、ふらつき、注意力低下など。連用による依存にも注意が必要です。',sourceLabel:'PMDA 医療用医薬品情報',sourceUrl:'https://www.pmda.go.jp/PmdaSearch/iyakuSearch/',stock:0},
{id:'maoto',use:'風邪など',name:'ツムラ麻黄湯',type:'必要時',when:'必要時',dose:'処方指示量',info:'漢方薬。',effects:'悪寒、発熱、頭痛、自然に汗が出ない場合の感冒やインフルエンザ初期などに用いられます。',side:'発疹、不眠、発汗過多、頻脈、動悸、胃部不快感、吐き気など。偽アルドステロン症などの重大な副作用にも注意します。',sourceLabel:'PMDA ツムラ麻黄湯 添付文書',sourceUrl:'https://www.pmda.go.jp/PmdaSearch/iyakuDetail/ResultDataSetPDF/460026_5200132D1035_1_12',stock:0},
{id:'lanso',use:'胃',name:'ランソプラゾールOD 15mg',type:'必要時',when:'必要時',dose:'処方指示量',info:'胃酸分泌抑制薬。',effects:'胃潰瘍、十二指腸潰瘍、逆流性食道炎などで胃酸分泌を抑えるために用いられます。',side:'下痢、便秘、腹部膨満感、吐き気、発疹など。',sourceLabel:'PMDA ランソプラゾール情報',sourceUrl:'https://www.pmda.go.jp/PmdaSearch/rdSearch/02/2329023F1101?user=1',stock:0},
{id:'epi',use:'鼻炎',name:'エピナスチン 10mg',type:'必要時',when:'必要時',dose:'1錠',info:'アレルギー症状に使用。',effects:'気管支喘息、アレルギー性鼻炎、じんましん、皮膚疾患に伴うかゆみなどに用いられます。',side:'眠気、口渇、倦怠感、胃部不快感など。',sourceLabel:'PMDA エピナスチン情報',sourceUrl:'https://www.pmda.go.jp/PmdaSearch/rdSearch/02/4490014F2315?user=1',stock:0},
{id:'zol',use:'睡眠',name:'ゾルピデム 5mg',type:'睡眠',when:'就寝前',dose:'処方指示量',info:'睡眠薬。処方指示を確認。',effects:'不眠症の治療に用いられます。',side:'眠気、ふらつき、健忘など。睡眠随伴症状として異常行動が現れることがあります。',sourceLabel:'PMDA・厚生労働省 安全性情報',sourceUrl:'https://www.pmda.go.jp/files/000247540.pdf',stock:0},
{id:'tri',use:'睡眠',name:'トリアゾラム 0.125mg',type:'睡眠',when:'就寝前',dose:'処方指示量',info:'睡眠導入薬。処方指示を確認。',effects:'不眠症、麻酔前投薬に用いられます。',side:'眠気、ふらつき、健忘など。睡眠随伴症状として異常行動が現れることがあります。',sourceLabel:'PMDA・厚生労働省 安全性情報',sourceUrl:'https://www.pmda.go.jp/files/000247540.pdf',stock:0},
{id:'esz',use:'睡眠',name:'エスゾピクロン 1mg',type:'過去',when:'就寝前',dose:'処方指示量',info:'過去の睡眠薬。',effects:'不眠症の治療に用いられます。',side:'眠気、味覚異常、ふらつきなど。睡眠随伴症状として異常行動が現れることがあります。',sourceLabel:'PMDA・厚生労働省 安全性情報',sourceUrl:'https://www.pmda.go.jp/files/000247540.pdf',stock:3},
{id:'nit',use:'睡眠',name:'ニトラゼパム 5mg',type:'過去',when:'就寝前',dose:'処方指示量',info:'過去の睡眠薬。',effects:'不眠症、麻酔前投薬、一部のてんかん発作に用いられます。',side:'眠気、注意力・集中力の低下、ふらつきなど。連用による依存にも注意が必要です。',sourceLabel:'PMDA ニトラゼパム添付文書',sourceUrl:'https://www.pmda.go.jp/PmdaSearch/bookSearch/01/04987124909517',stock:3},
{id:'quv',use:'睡眠',name:'クービビック 25mg',type:'過去',when:'不眠時',dose:'処方指示量',info:'過去の睡眠薬。',effects:'不眠症の治療に用いられます。',side:'傾眠、頭痛、めまいなど。翌朝の眠気に注意が必要です。',sourceLabel:'PMDA クービビック情報',sourceUrl:'https://www.pmda.go.jp/PmdaSearch/rdDetail/iyaku/1190033F1028_1?user=1',stock:3},
{id:'dayv',use:'睡眠',name:'デエビゴ 5mg',type:'過去',when:'不眠時',dose:'処方指示量',info:'過去の睡眠薬。',effects:'不眠症の治療に用いられます。',side:'傾眠、頭痛、倦怠感、悪夢、めまいなど。',sourceLabel:'PMDA デエビゴ添付文書',sourceUrl:'https://www.pmda.go.jp/PmdaSearch/bookSearch/01/04987028570776',stock:3},
{id:'bila',use:'鼻炎',name:'ビラノア 20mg',type:'過去',when:'就寝前',dose:'1錠',info:'過去の鼻炎薬。',effects:'アレルギー性鼻炎、じんましん、皮膚疾患に伴うかゆみに用いられます。',side:'眠気、頭痛、口渇など。',sourceLabel:'PMDA 医療用医薬品情報',sourceUrl:'https://www.pmda.go.jp/PmdaSearch/iyakuSearch/',stock:3},
{id:'fexo',use:'鼻炎',name:'フェキソフェナジン 60mg',type:'過去',when:'朝食後・就寝前',dose:'1錠',info:'過去の鼻炎薬。',effects:'アレルギー性鼻炎、じんましん、皮膚疾患に伴うかゆみに用いられます。',side:'頭痛、眠気、吐き気、腹痛など。',sourceLabel:'PMDA フェキソフェナジン情報',sourceUrl:'https://www.pmda.go.jp/PmdaSearch/rdDetail/iyaku/4490023F1156_1?user=1',stock:3}
];
let logs=JSON.parse(localStorage.getItem('medlogs')||'[]');let stocks=JSON.parse(localStorage.getItem('stocks')||'{}');
const stockLabels=['🟢 十分','🟡 少なくなってきた','🔴 もうすぐ無い','⚪ 不明'];
function save(){localStorage.setItem('medlogs',JSON.stringify(logs));localStorage.setItem('stocks',JSON.stringify(stocks));}
function dayKey(){const d=new Date();if(d.getHours()<5)d.setDate(d.getDate()-1);return d.toLocaleDateString('sv-SE');}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openSheet(h){document.getElementById('sheet').innerHTML=h+'<button class="btn big" type="button" onclick="closeSheet()">閉じる</button>';document.getElementById('modal').classList.remove('hidden');}
function closeSheet(){document.getElementById('modal').classList.add('hidden');}
function logMed(id){const m=medicines.find(x=>x.id===id);openSheet(`<h2>${esc(m.use)}｜${esc(m.name)}</h2><div class="sub">${esc(m.dose)}・${esc(m.when)}</div><div class="section">効き目</div><select id="eff"><option>分からない</option><option>よく効いた</option><option>効いた</option><option>少し効いた</option><option>効かなかった</option></select>${m.use==='睡眠'?'<div class="section">睡眠・翌朝</div><select id="cond"><option>未入力</option><option>よく眠れた</option><option>寝つきに時間がかかった</option><option>夜中に起きた</option><option>翌朝眠気が残った</option><option>ふらつく</option><option>記憶があいまい</option></select>':''}<div class="section">自由メモ</div><textarea id="memo"></textarea><button class="btn primary big" type="button" onclick="commitLog('${id}')">服用・使用を記録</button>`);}
function commitLog(id){const m=medicines.find(x=>x.id===id);logs.push({id,name:m.name,use:m.use,ts:new Date().toISOString(),day:dayKey(),eff:document.getElementById('eff').value,cond:document.getElementById('cond')?.value||'',memo:document.getElementById('memo').value});save();closeSheet();render();}
function todayCount(id){return logs.filter(x=>x.day===dayKey()&&x.id===id).length;}
function quick(m){const n=todayCount(m.id);return `<div class="${n?'quickTaken':''}"><div class="row" style="padding:9px 0;border-bottom:1px solid #eef0f4"><div class="grow"><b>${esc(m.use)}</b><div class="sub">${esc(m.name)}</div>${n?`<div class="pill" style="display:inline-block;margin-top:5px;background:#fff0d6;color:#a45300">今日 ${n}回記録</div>`:''}</div><button class="btn ${n?'count':''}" type="button" onclick="logMed('${m.id}')">${n?'＋'+n:'＋飲んだ'}</button></div></div>`;}
function renderToday(){const done=new Set(logs.filter(x=>x.day===dayKey()).map(x=>x.id));document.getElementById('todayView').innerHTML='<div class="section">今日やること</div>'+medicines.filter(x=>x.type==='定期').map(m=>`<div class="card ${done.has(m.id)?'done':''}"><div class="row"><div class="grow"><span class="pill">${esc(m.use)}</span><div class="title">${esc(m.name)}</div><div class="sub">${esc(m.when)}・${esc(m.dose)}</div></div><button class="btn ${done.has(m.id)?'taken':''}" type="button" onclick="logMed('${m.id}')">${done.has(m.id)?'✓ 記録済':'飲んだ'}</button></div></div>`).join('')+'<div class="section">💤 睡眠・就寝時</div><div class="card">'+medicines.filter(x=>x.type==='睡眠').map(quick).join('')+'</div><div class="section">必要なとき</div><div class="card">'+medicines.filter(x=>x.type==='必要時').map(quick).join('')+'</div>';}
function detail(id){const m=medicines.find(x=>x.id===id);openSheet(`<h2>${esc(m.use)}｜${esc(m.name)}</h2><p>${esc(m.info)}</p><div class="section">効果・効能</div><div class="card">${esc(m.effects||'この薬は製剤・処方目的の確認が必要なため、今は確定情報を表示していません。')}</div><div class="section">主な副作用・注意</div><div class="card">${esc(m.side||'処方元の説明書で確認してください。')}</div><div class="source">出典：${m.sourceUrl?`<a href="${m.sourceUrl}" target="_blank" rel="noopener noreferrer">${esc(m.sourceLabel)}</a>`:esc(m.sourceLabel||'処方元資料')}</div><div class="alert">表示は確認補助です。処方時の説明と最新の電子添文を優先してください。</div><div class="section">飲み方</div><div class="card">${esc(m.when)}・${esc(m.dose)}</div><div class="section">残量</div><select onchange="setStock('${id}',this.selectedIndex)">${stockLabels.map((x,i)=>`<option ${i===(stocks[id]??m.stock??3)?'selected':''}>${x}</option>`).join('')}</select>`);}
function setStock(id,n){stocks[id]=n;save();}
function renderMeds(){document.getElementById('medsView').innerHTML='<h2>薬一覧</h2>'+['定期','必要時','睡眠','過去'].map(g=>'<div class="section">'+g+'</div>'+medicines.filter(m=>m.type===g).map(m=>`<div class="card" onclick="detail('${m.id}')"><span class="pill">${esc(m.use)}</span><div class="title">${esc(m.name)}</div><div class="sub">${esc(m.when)}・${esc(m.dose)}｜${stockLabels[stocks[m.id]??m.stock??3]}</div></div>`).join('')).join('');}
function renderHistory(){const arr=[...logs].reverse();document.getElementById('historyView').innerHTML=`<h2>服薬履歴</h2><div class="grid"><div class="card"><b>${logs.length}</b><div class="mut">総記録数</div></div><div class="card"><b>${new Set(logs.map(x=>x.day)).size}</b><div class="mut">記録した日数</div></div></div>`+(arr.length?arr.map(x=>`<div class="card"><span class="pill">${esc(x.use)}</span><div class="title">${esc(x.name)}</div><div class="sub">${new Date(x.ts).toLocaleString('ja-JP')}・${esc(x.eff)}</div><div>${esc(x.memo||'')}</div></div>`).join(''):'<div class="card">まだ記録がありません。</div>');}
function updateApp(){const u=new URL(location.href);u.searchParams.set('_update',Date.now().toString());location.replace(u.toString());}
function renderMore(){document.getElementById('moreView').innerHTML=`<h2>その他</h2><div class="card"><div class="title">アプリ</div><div class="sub">安全版 ${APP_VERSION}</div><button class="btn primary big" type="button" onclick="updateApp()">🔄 アプリを更新</button><div class="sub">服薬履歴・残量設定は削除せず、公開中のページを再読み込みします。</div></div><div class="card"><div class="title">データ</div><div class="sub">服薬履歴 ${logs.length}件をこの端末に保存中</div></div>`;}
function render(){document.getElementById('dayLabel').textContent='服薬日 '+dayKey()+'（午前5時切替）';renderToday();renderMeds();renderHistory();renderMore();}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));document.getElementById(b.dataset.view).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');}));document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet();});render();
</script></body></html>
