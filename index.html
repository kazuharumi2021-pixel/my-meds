<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>お薬手帳 v1.2.1</title><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><style>:root{--b:#246bfd;--bg:#f5f7fb;--t:#172033;--m:#6d7788}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--t)}header{position:sticky;top:0;background:#f5f7fbf2;padding:16px;z-index:3}h1{margin:0;font-size:24px}.sub,.note{color:var(--m);font-size:12px;margin-top:4px}.wrap{max-width:720px;margin:auto;padding:0 14px 92px}.card{background:#fff;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 2px 12px #16233a0d}.section{font-weight:800;font-size:14px;margin:20px 3px 6px}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.title{font-weight:800}.pill{font-size:11px;background:#eef3ff;color:#2458bb;border-radius:999px;padding:4px 8px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800;background:#e9efff;color:#184fb7}.primary{background:var(--b);color:#fff}.red{background:#ffecec;color:#a82626}.big{width:100%;padding:15px;font-size:16px}.done{opacity:.55}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e6e9ef;display:flex;justify-content:center;z-index:5}.nav button{width:25%;max-width:180px;border:0;background:#fff;padding:10px 2px 18px;color:#687386}.nav .active{color:var(--b);font-weight:800}.hidden{display:none}select,input,textarea{width:100%;padding:11px;border:1px solid #dfe4ec;border-radius:12px;background:#fff;font:inherit;margin:5px 0}.alert{background:#fff4df;color:#7c4b00;padding:11px;border-radius:12px;font-size:13px}.danger{background:#fff0f0;color:#9e2525;padding:11px;border-radius:12px;font-size:13px}.info{background:#eef5ff;padding:12px;border-radius:12px;line-height:1.55}.modal{position:fixed;inset:0;background:#0006;z-index:9;display:flex;align-items:flex-end}.modal.hidden{display:none}.sheet{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:22px 22px 0 0;padding:18px;max-height:88vh;overflow:auto}.filebtn{display:block;text-align:center;border:1px dashed #9caccc;border-radius:14px;padding:14px;margin:8px 0;color:#315b9d}</style></head><body><header><h1>💊 My Meds</h1><div class="sub" id="day"></div></header><main class="wrap"><section id="today"></section><section id="meds" class="hidden"></section><section id="history" class="hidden"></section><section id="more" class="hidden"></section></main><nav class="nav"><button class="active" data-v="today">🏠<br>今日</button><button data-v="meds">💊<br>薬一覧</button><button data-v="history">📅<br>履歴</button><button data-v="more">⚙️<br>その他</button></nav><div id="modal" class="modal hidden"><div id="sheet" class="sheet"></div></div><script>
const VERSION='1.2.1';
const raw=[
['aga','発毛','Dクリニック 発毛内服 MH・FC・ZB','定期','朝','各1カプセル','発毛治療','院内調剤薬のため成分ごとの正式な効能・副作用は処方資料で確認','成分ごとに異なるため処方資料で確認'],
['dul','気分・痛み','デュロキセチン 20mg','定期','朝食後','1カプセル','気分・痛みの治療','うつ病・うつ状態。一部の疾患に伴う疼痛（糖尿病性神経障害、線維筋痛症、慢性腰痛症、変形性関節症）','傾眠、頭痛、めまい、悪心、食欲減退、口渇、便秘など'],
['tad','その他','タダラフィル 6mg','定期','1日1回','1錠','処方目的を確認','製剤・処方目的により異なるため処方資料で確認','頭痛、ほてりなどが知られるが、この登録薬の製剤情報を確認'],
['boost','発毛','Dミノキブースター＋外用薬','定期','洗髪後','指示量','発毛治療','院内調剤・外用薬のため処方資料で確認','成分・濃度により異なるため処方資料で確認'],
['lox','痛み','ロキソプロフェンNa 60mg','必要時','必要時','1錠','痛み・炎症・発熱','関節リウマチ、変形性関節症、腰痛症、歯痛などの消炎・鎮痛、手術後・外傷後・抜歯後の鎮痛・消炎、急性上気道炎の解熱・鎮痛','腹痛、胃部不快感、食欲不振、悪心、下痢、便秘、胸やけ、眠気など'],
['dia2','不安','ジアゼパム 2mg','必要時','必要時','処方指示量','不安・緊張など','正確な処方目的・効能は処方資料で確認','眠気、ふらつき等に注意。正式情報は添付文書で確認'],
['maoto','風邪など','ツムラ麻黄湯','必要時','必要時','処方指示量','風邪など','処方目的・製剤の添付文書を確認','体調変化があれば記録し、詳細は添付文書で確認'],
['lanso','胃','ランソプラゾールOD 15mg','必要時','必要時','処方指示量','胃酸を抑える薬','適応は疾患・処方目的により異なるため処方資料で確認','最新添付文書で確認'],
['epi','鼻炎','エピナスチン 10mg','必要時','必要時','1錠','アレルギー症状','アレルギー症状に使用。正確な適応は製剤の添付文書で確認','眠気などに注意。正式情報は添付文書で確認'],
['zol','睡眠','ゾルピデム 5mg','睡眠','就寝前','処方指示量','不眠症','不眠症（添付文書で対象範囲を確認）','眠気、ふらつき、健忘など。睡眠随伴症状・異常行動にも注意'],
['tri','睡眠','トリアゾラム 0.125mg','睡眠','就寝前','処方指示量','不眠症','不眠症、麻酔前投薬','眠気、めまい、ふらつき、健忘など。睡眠随伴症状・異常行動にも注意'],
['esz','睡眠','エスゾピクロン 1mg','過去','就寝前','処方指示量','不眠症','不眠症','眠気など。睡眠随伴症状・異常行動にも注意'],
['nit','睡眠','ニトラゼパム 5mg','過去','就寝前','処方指示量','睡眠','正式な効能は製剤の添付文書で確認','眠気、ふらつき等に注意。正式情報は添付文書で確認'],
['quv','睡眠','クービビック 25mg','過去','不眠時','処方指示量','不眠症','正式な効能は製剤の添付文書で確認','眠気等に注意。正式情報は添付文書で確認'],
['dayv','睡眠','デエビゴ 5mg','過去','不眠時','処方指示量','不眠症','正式な効能は製剤の添付文書で確認','眠気等に注意。正式情報は添付文書で確認'],
['bila','鼻炎','ビラノア 20mg','過去','空腹時','1錠','アレルギー症状','アレルギー性鼻炎、蕁麻疹、皮膚疾患に伴うそう痒','眠気、口渇、頭痛など'],
['fexo','鼻炎','フェキソフェナジン 60mg','過去','朝食後・就寝前','1錠','アレルギー症状','正確な適応は製剤の添付文書で確認','頭痛、傾眠等が報告されることがある。正式情報は添付文書で確認']];
const base=raw.map(x=>({id:x[0],use:x[1],name:x[2],type:x[3],when:x[4],dose:x[5],purpose:x[6],effects:x[7],side:x[8]}));let userMeds=JSON.parse(localStorage.getItem('userMeds')||'[]'),logs=JSON.parse(localStorage.getItem('medlogs')||'[]'),stocks=JSON.parse(localStorage.getItem('stocks')||'{}');const meds=()=>base.concat(userMeds),stockL=['🟢 十分','🟡 少なくなってきた','🔴 もうすぐ無い','⚪ 不明'];function save(){localStorage.setItem('medlogs',JSON.stringify(logs));localStorage.setItem('stocks',JSON.stringify(stocks));localStorage.setItem('userMeds',JSON.stringify(userMeds))}function key(){let d=new Date();if(d.getHours()<5)d.setDate(d.getDate()-1);return d.toLocaleDateString('sv-SE')}function sh(h){sheet.innerHTML=h+'<button class="btn big" onclick="cl()">閉じる</button>';modal.classList.remove('hidden')}function cl(){modal.classList.add('hidden')}
function take(id){let m=meds().find(x=>x.id===id);sh(`<h2>${m.use}｜${m.name}</h2><div class="sub">${m.when}・${m.dose}</div><div class="section">効き目</div><select id="eff"><option>分からない</option><option>よく効いた</option><option>効いた</option><option>少し効いた</option><option>効かなかった</option></select>${m.use==='睡眠'?'<div class="section">睡眠・翌朝</div><select id="cond"><option>未入力</option><option>よく眠れた</option><option>寝つきに時間がかかった</option><option>夜中に起きた</option><option>何度も起きた</option><option>翌朝問題なし</option><option>翌朝眠気が残った</option><option>だるい</option><option>ふらつく</option><option>頭痛</option><option>記憶があいまい</option><option>覚えていない行動があった</option></select>':''}<div class="section">自由メモ</div><textarea id="memo"></textarea><button class="btn primary big" onclick="commit('${id}')">服用・使用を記録</button>`)}function commit(id){let m=meds().find(x=>x.id===id);logs.push({id,name:m.name,use:m.use,ts:new Date().toISOString(),day:key(),eff:eff.value,cond:document.getElementById('cond')?.value||'',memo:memo.value});save();cl();render()}function q(m){return `<div class="row" style="padding:9px 0;border-bottom:1px solid #eef0f4"><div class="grow"><b>${m.use}</b><div class="sub">${m.name}</div></div><button class="btn" onclick="take('${m.id}')">＋飲んだ</button></div>`}
function renderToday(){let done=new Set(logs.filter(x=>x.day===key()).map(x=>x.id));today.innerHTML='<div class="section">今日やること</div>'+meds().filter(x=>x.type==='定期').map(m=>`<div class="card ${done.has(m.id)?'done':''}"><div class="row"><div class="grow"><span class="pill">${m.use}</span><div class="title">${m.name}</div><div class="sub">${m.when}・${m.dose}</div></div><button class="btn" onclick="take('${m.id}')">${done.has(m.id)?'✓ 記録済':'飲んだ'}</button></div></div>`).join('')+'<div class="section">💤 睡眠・就寝時</div><div class="card"><div class="alert">睡眠薬の種類・組み合わせ・量は処方指示を優先してください。</div>'+meds().filter(x=>x.type==='睡眠').map(q).join('')+'</div><div class="section">必要なとき</div><div class="card">'+meds().filter(x=>x.type==='必要時').map(q).join('')+'</div><button class="btn primary big" onclick="localStorage.setItem(`finished_${key()}`,1);alert(`今日を完了しました`)">✓ 今日を完了</button>'}
function detail(id){let m=meds().find(x=>x.id===id);sh(`<h2>${m.use}｜${m.name}</h2><div class="section">何のための薬？</div><div class="info"><b>${m.purpose||'登録時の目的'}</b></div><div class="section">効果・効能</div><div class="card">${m.effects||'未登録。処方資料・添付文書で確認してください。'}</div><div class="section">主な副作用・注意</div><div class="card">${m.side||'未登録。処方資料・添付文書で確認してください。'}</div>${['zol','tri','esz'].includes(id)?'<div class="danger"><b>🚨 睡眠薬の重要な注意</b><br>睡眠随伴症状（夢遊症状等）として異常行動が現れることがあります。過去に同様の症状があった場合や異常行動が出た場合は、処方医などに速やかに相談してください。</div>':''}<div class="alert" style="margin-top:10px">表示は確認補助です。副作用は全員に起こるものではありません。処方時の説明と最新の電子添文を優先してください。</div><div class="section">飲み方</div><div class="card">${m.when}・${m.dose}</div><div class="section">残量</div><select onchange="stocks['${id}']=this.selectedIndex;save()">${stockL.map((s,i)=>`<option ${i===(stocks[id]??3)?'selected':''}>${s}</option>`).join('')}</select><div class="section">自分の使用結果</div>${logs.filter(x=>x.id===id).slice(-8).reverse().map(x=>`<div class="card"><b>${new Date(x.ts).toLocaleString('ja-JP')}</b><div class="sub">${x.eff}${x.cond?'・'+x.cond:''}</div><div>${x.memo||''}</div></div>`).join('')||'<div class="sub">記録なし</div>'}`)}
function renderMeds(){document.getElementById('meds').innerHTML='<div class="row"><h2 class="grow">薬一覧</h2><button class="btn primary" onclick="add()">＋薬を追加</button></div>'+['定期','必要時','睡眠','過去'].map(g=>'<div class="section">'+g+'</div>'+window.meds().filter(x=>x.type===g).map(m=>`<div class="card" onclick="detail('${m.id}')"><span class="pill">${m.use}</span><div class="title">${m.name}</div><div class="sub"><b>${m.purpose||''}</b>｜${m.when}・${m.dose}｜${stockL[stocks[m.id]??3]}</div></div>`).join('')).join('')}function renderHistory(){history.innerHTML='<h2>服薬履歴</h2>'+[...logs].reverse().map(x=>`<div class="card"><span class="pill">${x.use}</span><div class="title">${x.name}</div><div class="sub">${new Date(x.ts).toLocaleString('ja-JP')}・${x.eff}${x.cond?'・'+x.cond:''}</div><div>${x.memo||''}</div><button class="btn red" onclick="del('${x.ts}')">削除</button></div>`).join('')||'<div class="card">まだ記録がありません。</div>'}function del(ts){if(confirm('削除しますか？')){logs=logs.filter(x=>x.ts!==ts);save();render()}}
function updateApp(){let u=new URL(location.href);u.searchParams.set('_update',Date.now());location.replace(u.toString())}function add(){sh(`<h2>薬を追加</h2><label class="filebtn">📷 カメラで撮影<input type="file" accept="image/*" capture="environment" hidden></label><label class="filebtn">🖼️ 写真から選択<input type="file" accept="image/*" hidden></label><div class="alert">画像OCRは今後の連携機能です。現在は確認して手入力してください。</div><input id="nn" placeholder="薬名"><select id="nu"><option>睡眠</option><option>鼻炎</option><option>痛み</option><option>不安</option><option>胃</option><option>発毛</option><option>その他</option></select><select id="nt"><option>必要時</option><option>定期</option><option>睡眠</option><option>過去</option></select><input id="nd" placeholder="1回量・飲み方"><input id="np" placeholder="何のための薬？"><textarea id="ne" placeholder="効能メモ"></textarea><textarea id="ns" placeholder="副作用メモ"></textarea><button class="btn primary big" onclick="manual()">登録</button>`)}function manual(){if(!nn.value.trim())return alert('薬名を入力してください');userMeds.push({id:'u'+Date.now(),name:nn.value.trim(),use:nu.value,type:nt.value,when:'登録内容',dose:nd.value||'要確認',purpose:np.value,effects:ne.value,side:ns.value});save();cl();render()}function renderMore(){more.innerHTML=`<h2>その他</h2><div class="card"><div class="title">アプリ</div><div class="sub">バージョン ${VERSION}</div><button class="btn primary big" onclick="updateApp()">🔄 アプリを更新</button><div class="sub">服薬履歴・自分で追加した薬・残量設定は保持したまま再読込します。</div></div><div class="card"><div class="title">薬を追加</div><button class="btn big" onclick="add()">📷 撮影 / 🖼️写真 / ✏️手入力</button></div><div class="card"><div class="title">医薬品情報について</div><div class="note">効能・副作用は確認補助です。薬の製造販売元や製剤が特定できない項目は断定せず「添付文書で確認」としています。</div></div>`}
function render(){day.textContent='服薬日 '+key()+'（午前5時切替）';renderToday();renderMeds();renderHistory();renderMore()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));document.getElementById(b.dataset.v).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});modal.onclick=e=>{if(e.target===modal)cl()};render();
</script></body></html>
